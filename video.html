<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Украинский MAX - Video</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b0e14; font-family: sans-serif; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1c2128; padding: 10px 15px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #30363d; display: flex; gap: 8px; align-items: center; }
        #backBtn { background: #30363d; border: none; color: white; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-size: 18px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; padding: 10px 15px; border-radius: 20px; color: white; outline: none; font-size: 16px; }
        #searchBtn { background: #238636; border: none; color: white; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .container { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; -webkit-overflow-scrolling: touch; }
        .v-card { background: #1c2128; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid transparent; }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .v-info { padding: 10px; }
        .v-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-author { font-size: 12px; color: #8b949e; }
        #player-overlay { display: none; position: fixed; inset: 0; background: black; z-index: 1000; flex-direction: column; }
        .close-player { padding: 10px 20px; text-align: right; font-size: 35px; cursor: pointer; color: white; background: #1c2128; }
        iframe { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>
<header>
    <button id="backBtn" onclick="window.location.href='index.html'">⬅</button>
    <input type="text" id="searchInput" placeholder="Поиск видео...">
    <button id="searchBtn">Найти</button>
</header>
<div class="container" id="videoGrid"></div>
<div id="player-overlay">
    <div class="close-player" id="closeBtn">×</div>
    <div id="videoContainer" style="flex:1; display:flex;"></div>
</div>
<script>
    const videoGrid = document.getElementById('videoGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const playerOverlay = document.getElementById('player-overlay');
    const videoContainer = document.getElementById('videoContainer');
    const closeBtn = document.getElementById('closeBtn');

    const instances = ['https://yewtu.be', 'https://invidious.snopyta.org', 'https://inv.riverside.rocks'];
    let currentInstance = instances[0];

    async function searchVideos(query = 'танки кв-2') {
        videoGrid.innerHTML = '<p style="text-align:center; width:100%;">Ищем контент...</p>';
        try {
            const res = await fetch(`${currentInstance}/api/v1/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            displayVideos(data);
        } catch (err) { videoGrid.innerHTML = '<p>Ошибка. Попробуй нажать "Найти" еще раз.</p>'; }
    }

    function displayVideos(videos) {
        videoGrid.innerHTML = '';
        videos.forEach(v => {
            if (v.type !== 'video') return;
            const card = document.createElement('div');
            card.className = 'v-card';
            card.innerHTML = `<img src="${currentInstance}/vi/${v.videoId}/mqdefault.jpg"><div class="v-info"><div class="v-title">${v.title}</div><div class="v-author">${v.author}</div></div>`;
            card.onclick = () => openPlayer(v.videoId);
            videoGrid.appendChild(card);
        });
    }

    function openPlayer(id) {
        playerOverlay.style.display = 'flex';
        videoContainer.innerHTML = `<iframe src="${currentInstance}/embed/${id}?autoplay=1" allowfullscreen></iframe>`;
    }

    closeBtn.onclick = () => { playerOverlay.style.display = 'none'; videoContainer.innerHTML = ''; };
    searchBtn.onclick = () => searchVideos(searchInput.value);
    searchInput.onkeypress = (e) => { if(e.key === 'Enter') searchVideos(searchInput.value); };
    searchVideos();
</script>
</body>
</html>
