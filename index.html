<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubas Stream</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b0e14; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; color: white; overflow: hidden; }
        #chat-messages { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden; }
        .msg-wrapper { display: flex; width: 100%; flex-direction: column; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 18px; line-height: 1.4; word-wrap: break-word; background: #30363d; align-self: flex-start; }
        .my-msg-wrapper { align-items: flex-end; }
        .my-msg { background: #238636; align-self: flex-end; }
        .input-area { background: #1c2128; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #30363d; }
        input { flex-grow: 1; padding: 15px; border-radius: 12px; border: none; outline: none; background: #0d1117; color: white; font-size: 18px; }
        button { background: #238636; color: white; border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        button:active { background: #2ea043; transform: scale(0.95); }
    </style>
</head>
<body>

<div id="chat-messages"></div>

<div class="input-area">
    <input type="text" id="msgInput" placeholder="Пиши сюда..." autocomplete="off">
    <button id="sendBtn">ОТПРАВИТЬ</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMgd0KOSCfyJ0RWk3qhpk667C0v0358_c",
    authDomain: "bubaschat.firebaseapp.com",
    databaseURL: "https://bubaschat-default-rtdb.firebaseio.com",
    projectId: "bubaschat",
    storageBucket: "bubaschat.firebasestorage.app",
    messagingSenderId: "360805253305",
    appId: "1:360805253305:web:6f5ed2c212513f5723b762"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages');

  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  const container = document.getElementById('chat-messages');

  function sendToDB() {
    const text = input.value.trim();
    if (text !== "") {
      push(messagesRef, { text: text });
      input.value = "";
    }
  }

  btn.onclick = sendToDB;
  input.onkeypress = (e) => { if(e.key === "Enter") sendToDB(); };

  const lastMessagesQuery = query(messagesRef, limitToLast(20));

  onChildAdded(lastMessagesQuery, (snapshot) => {
    const data = snapshot.val();
    renderMessage(data.text);
  });

  function renderMessage(text) {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper';
    const div = document.createElement('div');
    div.className = 'msg';
    
    if (text.startsWith('!')) {
        wrapper.classList.add('my-msg-wrapper');
        div.classList.add('my-msg');
        div.innerText = text.substring(1);
    } else {
        div.innerText = text;
    }
    
    wrapper.appendChild(div);
    container.appendChild(wrapper);

    if (container.children.length > 25) {
        container.removeChild(container.firstChild);
    }
  }
</script>
</body>
</html>
