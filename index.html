<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Украинский MAX</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100%; margin: 0; padding: 0; background: #0b0e14; overflow: hidden; font-family: sans-serif; }
        body { display: flex; flex-direction: column; color: white; }
        #m-s { display: none; position: fixed; inset: 0; background: #0b0e14; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; }
        .top-bar { background: #1c2128; padding: 0 15px; min-height: 50px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; }
        #profileBtn { background: #30363d; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        #chat-messages { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; position: relative; }
        #floating-date { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(33, 38, 45, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 3px 10px; border-radius: 12px; font-size: 11px; color: rgba(240, 246, 252, 0.8); z-index: 5000; opacity: 0; transition: opacity 0.3s; pointer-events: none; border: 1px solid rgba(255,255,255,0.05); }
        .date-divider { text-align: center; margin: 20px 0; display: flex; justify-content: center; }
        .date-divider span { background: #1c2128; padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #8b949e; border: 1px solid #30363d; }
        .msg-wrapper { display: flex; width: 100%; flex-direction: column; flex-shrink: 0; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 16px; font-size: 15px; background: #21262d; align-self: flex-start; border: 1px solid #30363d; cursor: pointer; white-space: pre-wrap; word-break: break-word; position: relative; }
        .msg b { color: #58a6ff; font-size: 11px; display: block; margin-bottom: 2px; }
        .my-msg-wrapper { align-items: flex-end; }
        .my-msg { background: #30363d; border-color: #484f58; align-self: flex-end; border-bottom-right-radius: 4px; }
        #action-menu { display: none; position: fixed; background: #1c2128; border: 1px solid #30363d; border-radius: 12px; z-index: 30000; min-width: 170px; overflow: hidden; box-shadow: 0 5px 25px rgba(0,0,0,0.7); }
        .action-item { padding: 12px 18px; font-size: 15px; cursor: pointer; border-bottom: 1px solid #30363d; }
        .action-item:last-child { border-bottom: none; }
        .action-item.del { color: #f85149; }
        #confirm-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50000; align-items: center; justify-content: center; }
        .confirm-box { background: #1c2128; width: 85%; max-width: 280px; border-radius: 14px; border: 1px solid #30363d; text-align: center; overflow: hidden; }
        .confirm-text { padding: 20px; font-size: 16px; line-height: 1.4; border-bottom: 1px solid #30363d; }
        .confirm-btns { display: flex; }
        .confirm-btns button { flex: 1; padding: 14px; border: none; background: none; color: #58a6ff; font-size: 16px; cursor: pointer; font-weight: 500; }
        .confirm-btns button.btn-del { color: #f85149; border-left: 1px solid #30363d; }
        .input-area { background: #1c2128; padding: 12px 15px; display: flex; gap: 10px; border-top: 1px solid #30363d; align-items: center; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        input { flex-grow: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 16px; }
        #sendBtn { background: none; border: none; color: #58a6ff; font-size: 26px; cursor: pointer; }
        #reply-preview, #edit-preview { display: none; background: #1c2128; padding: 8px 15px; border-top: 1px solid #30363d; border-left: 4px solid #58a6ff; position: relative; }
        #edit-preview { border-left-color: #3fb950; }
        .cancel-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #8b949e; cursor: pointer; font-size: 20px; }
        #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; align-items: center; justify-content: center; }
        .settings-content { background: #1c2128; padding: 20px; border-radius: 15px; width: 90%; max-width: 320px; border: 1px solid #30363d; }
        #toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #f85149; color: white; padding: 10px 20px; border-radius: 8px; z-index: 60000; font-size: 14px; }
    </style>
</head>
<body>
<div id="m-s"><h1>ТЕХ ПЕРЕРЫВ</h1></div>
<div id="toast"></div>
<div id="floating-date"></div>
<div id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-text">Удалить сообщение у всех?</div>
        <div class="confirm-btns">
            <button id="conf-cancel">Отмена</button>
            <button id="conf-yes" class="btn-del">Удалить</button>
        </div>
    </div>
</div>
<div class="top-bar"><button id="profileBtn">Настройки</button></div>
<div id="action-menu">
    <div class="action-item" id="act-reply">Ответить</div>
    <div class="action-item" id="act-copy">Копировать</div>
    <div class="action-item" id="act-edit">Изменить</div>
    <div class="action-item del" id="act-del">Удалить у всех</div>
</div>
<div id="settings-modal">
    <div class="settings-content">
        <h3 style="margin-top:0; color:#58a6ff;">Настройки</h3>
        <label style="font-size:12px; color:#8b949e;">Ник:</label>
        <input type="text" id="set-name" maxlength="15" style="width:100%; margin-bottom:15px; margin-top:5px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:white; padding:10px;">
        <label style="font-size:12px; color:#8b949e;">Пароль (4 цифры):</label>
        <input type="password" id="set-pass" maxlength="4" inputmode="numeric" style="width:100%; margin-bottom:15px; margin-top:5px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:white; padding:10px;">
        <button id="saveSettings" style="width:100%; background:#58a6ff; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold;">Сохранить</button>
    </div>
</div>
<div id="chat-messages"></div>
<div id="reply-preview">
    <b id="r-n" style="font-size:12px; color:#58a6ff; display:block;"></b>
    <span id="r-t" style="font-size:13px; color:#8b949e; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    <div class="cancel-btn" id="cancel-reply">×</div>
</div>
<div id="edit-preview">
    <b style="font-size:12px; color:#3fb950; display:block;">Изменение</b>
    <span id="e-t" style="font-size:13px; color:#8b949e; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    <div class="cancel-btn" id="cancel-edit">×</div>
</div>
<div class="input-area">
    <input type="text" id="m-i" placeholder="Сообщение" maxlength="100" autocomplete="off">
    <button id="sendBtn">➤</button>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, query, limitToLast, onValue, remove, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  const cfg = {
    apiKey: "AIzaSyCMgd0KOSCfyJ0RWk3qhpk667C0v0358_c",
    authDomain: "bubaschat.firebaseapp.com",
    databaseURL: "https://bubaschat-default-rtdb.firebaseio.com",
    projectId: "bubaschat",
    storageBucket: "bubaschat.firebasestorage.app",
    messagingSenderId: "360805253305",
    appId: "1:360805253305:web:6f5ed2c212513f5723b762"
  };
  const app = initializeApp(cfg);
  const db = getDatabase(app);
  let u = localStorage.getItem('chat_name') || "Аноним";
  let p = localStorage.getItem('chat_pass') || "";
  let activeMsg = null;
  let editingId = null;
  let curD = "";
  let scrollTimer;
  const menu = document.getElementById('action-menu');
  const confModal = document.getElementById('confirm-modal');
  const inp = document.getElementById('m-i');
  const sendBtn = document.getElementById('sendBtn');
  const fDate = document.getElementById('floating-date');
  const box = document.getElementById('chat-messages');
  function showToast(txt) {
      const t = document.getElementById('toast');
      t.innerText = txt; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
  }
  onValue(ref(db, 'maintenance'), (s) => {
    document.getElementById('m-s').style.display = (s.val() === true) ? 'flex' : 'none';
  });
  box.addEventListener('scroll', () => {
      const divs = box.querySelectorAll('.date-divider');
      let cvd = "";
      divs.forEach(div => {
          if (div.offsetTop <= box.scrollTop + 120) cvd = div.innerText;
      });
      if (cvd) {
          fDate.innerText = cvd; fDate.style.opacity = '1';
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => { fDate.style.opacity = '0'; }, 1000);
      }
  });
  document.getElementById('profileBtn').onclick = () => {
      document.getElementById('set-name').value = u;
      document.getElementById('set-pass').value = p;
      document.getElementById('settings-modal').style.display = 'flex';
  };
  document.getElementById('saveSettings').onclick = async () => {
      const n = document.getElementById('set-name').value.trim();
      const ps = document.getElementById('set-pass').value.trim();
      if(!n || ps.length < 4) { showToast("Ник и 4 цифры пароля!"); return; }
      const snap = await get(ref(db, `active_nicks/${n}`));
      if(snap.exists() && snap.val() !== ps) { showToast("Ник занят"); return; }
      if(u !== n && u !== "Аноним") remove(ref(db, `active_nicks/${u}`));
      set(ref(db, `active_nicks/${n}`), ps).then(() => {
          u = n; p = ps;
          localStorage.setItem('chat_name', u); localStorage.setItem('chat_pass', p);
          document.getElementById('settings-modal').style.display = 'none';
      });
  };
  document.getElementById('act-del').onclick = () => { menu.style.display = 'none'; confModal.style.display = 'flex'; };
  document.getElementById('conf-cancel').onclick = () => confModal.style.display = 'none';
  document.getElementById('conf-yes').onclick = () => {
      if(activeMsg && activeMsg.id) remove(ref(db, `messages/${activeMsg.id}`));
      confModal.style.display = 'none';
  };
  document.getElementById('act-copy').onclick = () => { navigator.clipboard.writeText(activeMsg.text); menu.style.display = 'none'; };
  document.getElementById('act-reply').onclick = () => {
      editingId = null;
      document.getElementById('r-n').innerText = activeMsg.name;
      document.getElementById('r-t').innerText = activeMsg.text;
      document.getElementById('reply-preview').style.display = 'block';
      document.getElementById('edit-preview').style.display = 'none';
      sendBtn.innerText = "➤"; sendBtn.style.color = "#58a6ff";
      menu.style.display = 'none'; inp.focus();
  };
  document.getElementById('act-edit').onclick = () => {
      editingId = activeMsg.id;
      inp.value = activeMsg.text;
      document.getElementById('e-t').innerText = activeMsg.text;
      document.getElementById('edit-preview').style.display = 'block';
      document.getElementById('reply-preview').style.display = 'none';
      sendBtn.innerText = "✓"; sendBtn.style.color = "#3fb950";
      menu.style.display = 'none'; inp.focus();
  };
  document.getElementById('cancel-reply').onclick = () => document.getElementById('reply-preview').style.display = 'none';
  document.getElementById('cancel-edit').onclick = () => { 
      editingId = null; inp.value = ""; 
      document.getElementById('edit-preview').style.display = 'none';
      sendBtn.innerText = "➤"; sendBtn.style.color = "#58a6ff";
  };
  function send() {
      const v = inp.value.trim();
      if(!v) return;
      if(editingId) {
          update(ref(db, `messages/${editingId}`), { text: v, edited: true });
          document.getElementById('cancel-edit').onclick();
      } else {
          const m = { name: u, text: v, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) };
          const rp = document.getElementById('reply-preview');
          if(rp.style.display === 'block') { m.replyTo = document.getElementById('r-n').innerText; m.replyText = document.getElementById('r-t').innerText; }
          push(ref(db, 'messages'), m);
          inp.value = ""; rp.style.display = 'none';
      }
  }
  sendBtn.onclick = send;
  inp.onkeypress = (e) => { if(e.key === "Enter") send(); };
  document.addEventListener('click', (e) => { if(!e.target.closest('.msg')) menu.style.display = 'none'; });
  onChildAdded(query(ref(db, 'messages'), limitToLast(50)), (s) => {
      const d = s.val(); const id = s.key;
      if(d.date !== curD) {
          const div = document.createElement('div'); div.className = 'date-divider';
          div.innerHTML = `<span>${d.date}</span>`; box.appendChild(div); curD = d.date;
      }
      const wrap = document.createElement('div'); wrap.className = 'msg-wrapper';
      if(d.name === u) wrap.classList.add('my-msg-wrapper');
      const m = document.createElement('div'); m.className = 'msg' + (d.name === u ? ' my-msg' : '');
      let rH = d.replyTo ? `<div style="background:rgba(88,166,255,0.1); border-left:3px solid #58a6ff; padding:4px 8px; margin-bottom:5px; border-radius:4px; font-size:13px; color:#8b949e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><b>${d.replyTo}</b>${d.replyText}</div>` : "";
      m.innerHTML = `${rH}<b>${d.name}</b><span class="t">${d.text}</span><div style="display:flex; justify-content:flex-end; align-items:center; margin-top:2px;"><span class="ed" style="font-size:10px; opacity:0.5; margin-right:4px; display:${d.edited?'inline':'none'}">изм.</span><i style="font-size:10px; opacity:0.4;">${d.time}</i></div>`;
      m.onclick = (e) => {
          activeMsg = { id, name: d.name, text: d.text };
          document.getElementById('act-del').style.display = (d.name === u) ? 'block' : 'none';
          document.getElementById('act-edit').style.display = (d.name === u) ? 'block' : 'none';
          menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
          menu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
          menu.style.display = 'block';
      };
      onValue(ref(db, `messages/${id}`), (sn) => {
          if(!sn.exists()) wrap.remove();
          else { m.querySelector('.t').innerText = sn.val().text; m.querySelector('.ed').style.display = sn.val().edited ? 'inline' : 'none'; }
      });
      wrap.appendChild(m); box.appendChild(wrap); box.scrollTop = box.scrollHeight;
  });
</script>
</body>
</html>
